services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:-latest}
    container_name: dujiao-next
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18083}:8080"
    env_file:
      - ../.env
    volumes:
      - ../config.yml:/app/config.yml:ro
      - ../db:/app/db
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
